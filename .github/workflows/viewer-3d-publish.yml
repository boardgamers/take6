name: Viewer 3D - Version and Release

on:
    workflow_dispatch:
        inputs:
            newversion:
                description: 'Semantic Version Bump Type'
                type: choice
                required: true
                default: patch
                options:
                    - patch
                    - minor
                    - major

env:
    node_version: 24

defaults:
    run:
        working-directory: viewer-3d

jobs:
    version_and_release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ env.node_version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.node_version }}
                  # registry-url is required so npm publish targets the public npm registry
                  registry-url: 'https://registry.npmjs.org'
            - run: corepack enable
            - run: pnpm install
            - run: git config --global user.name github-actions
            - run: git config --global user.email bot@github.com
            # npm version bumps the version in package.json (no semver module needed, which
            # pnpm's non-hoisted node_modules wouldn't provide anyway)
            - run: npm version ${{ github.event.inputs.newversion }} --no-git-tag-version
            - run: |
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  git add .
                  git commit -m "🔖 take6-viewer-3d $PACKAGE_VERSION"
            # prepublishOnly runs `pnpm build:lib`, producing the UMD bundle in dist-lib/.
            # pnpm 10.16+ supports OIDC trusted publishing (id-token: write above) and rewrites
            # the workspace:* take6-engine dependency to a real version range on publish.
            - run: pnpm publish --access public --no-git-checks
            - run: git push --follow-tags
